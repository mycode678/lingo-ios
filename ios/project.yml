# 用 XcodeGen 生成工程：project.pbxproj 是机器生成的，手写会烂掉，
# 这个 yml 才是真正的工程定义。
#   brew install xcodegen && cd ios && xcodegen generate && open Lingo.xcodeproj
name: Lingo
options:
  bundleIdPrefix: com.lingo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    # 真机测试用他的个人团队（免费账号，证书 7 天有效，够跑测试）。
    # 云端出 .ipa 时会传 CODE_SIGNING_ALLOWED=NO 覆盖掉，不受影响。
    DEVELOPMENT_TEAM: 38H3762BC6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
  configs:
    # `@testable import Lingo` 要求宿主是"为测试编译"的。
    # Xcode 自己建工程时 Debug 默认带这个，XcodeGen 不带 ——
    # 不加的话单元测试直接报 module 'Lingo' was not compiled for testing。
    debug:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  Lingo:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # 手机端对齐模型（181M，fp16）。超过 GitHub 单文件上限，不进仓库：
      # Mac 上放在 ~/lingo-models/，构建前由 agent 脚本软链到 ios/models/。
      # 云端 CI 没有这个目录，optional 让它照样能编译（那边只跑界面测试）。
      - path: models
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Lingo                    # 不写的话产物会变成名字为空的 .app
        PRODUCT_BUNDLE_IDENTIFIER: com.lingo.listen
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Info.plist 由 XcodeGen 生成，不要再放进资源里 —— 两边都产出同一个文件会报
    # "Multiple commands produce Info.plist"（踩过）
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 听说训练台
        CFBundleShortVersionString: "1.0"
        UIBackgroundModes: [audio]             # 锁屏继续放音
        NSMicrophoneUsageDescription: 录下你的跟读，跟原声比对打分。录音只留在这台手机上，不会上传。
        NSSpeechRecognitionUsageDescription: 把你的跟读听写成文字，好告诉你哪个词念得不像。全程在这台手机上完成，不联网、不上传。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true         # 自签证书的局域网服务器
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # 纯逻辑测试：七个练法的出题和判卷规则。**不开界面、几秒钟跑完**。
  # 有它才敢改阈值——挖几个空、多长算弱读、难度线定在哪，改完跑一遍就知道有没有破。
  LingoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Lingo
    settings:
      base:
        PRODUCT_NAME: LingoTests
        PRODUCT_BUNDLE_IDENTIFIER: com.lingo.listen.tests
        GENERATE_INFOPLIST_FILE: YES
        # 挂在 App 里跑：常用词表是 App 的资源，不挂宿主就读不到，
        # 难度闸那几条会静默跳过（跳过的测试等于没测）。
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lingo.app/Lingo"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # 真机式自测：模拟器里真的转屏、真的点、真的滑，断言"能不能点到""滚不滚得动"。
  # 静态截图看不出手势能不能用 —— 横屏控制条滚不动那种问题只有真滑一次才知道。
  LingoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Lingo
    settings:
      base:
        # PRODUCT_NAME 一定要写：不写的话 UI 测试的 Runner 会生成一个名字为空的 .app，
        # 编译直接报 "Multiple commands produce .../.app"（本地 Xcode 16.2 上必现）
        PRODUCT_NAME: LingoUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.lingo.listen.uitests
        TEST_TARGET_NAME: Lingo
        GENERATE_INFOPLIST_FILE: YES

# XcodeGen 默认生成的 scheme 不带测试动作，xcodebuild test 会说"找不到设备"
# （其实是找不到可测的 target）。这里显式挂上。
schemes:
  Lingo:
    build:
      targets:
        Lingo: all
        LingoTests: [test]
        LingoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LingoTests, LingoUITests]
