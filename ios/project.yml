# 用 XcodeGen 生成工程：project.pbxproj 是机器生成的，手写会烂掉，
# 这个 yml 才是真正的工程定义。
#   brew install xcodegen && cd ios && xcodegen generate && open Lingo.xcodeproj
name: Lingo
options:
  bundleIdPrefix: com.lingo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  Lingo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingo.listen
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ENABLE_BITCODE: NO
        GENERATE_INFOPLIST_FILE: NO
    # Info.plist 由 XcodeGen 生成，不要再放进资源里 —— 两边都产出同一个文件会报
    # "Multiple commands produce Info.plist"（踩过）
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 听说训练台
        CFBundleShortVersionString: "1.0"
        UIBackgroundModes: [audio]             # 锁屏继续放音
        NSMicrophoneUsageDescription: 录下你的跟读，跟原声比对打分。录音只发到你自己的服务器。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true         # 自签证书的局域网服务器
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
