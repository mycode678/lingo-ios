# 云端跑 iOS 模拟器，自动截图 —— 相当于网页那边的 headless Chrome。
# 改完布局先看这些图，别让人肉眼替我 debug。
name: G0 验证（模拟器）

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/shots.yml"]
  workflow_dispatch:

# 一次只留最新那一轮：连着推几个提交时，前面还在跑的直接取消。
# 不然每推一次就来一封失败邮件，而那些失败往往是下一个提交已经修掉的旧错误。
concurrency:
  group: g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 隐私红线：方案里用户的原话是"录音在用户自己的手机上，服务器不碰"。
      # 只要 App 代码里重新出现上传录音的路径，这一步就红 —— 放最前面，编译都不用等。
      - name: 隐私红线守卫
        run: ios/guard-privacy.sh

      # 中文引号守卫：把 「」 打成 ASCII 的 " 会让 Swift 字符串断成三段，
      # 报一堆 cannot find '某某' in scope。几毫秒的检查，别让它占掉一轮 CI。
      - name: 中文引号守卫
        run: python3 ios/check-quotes.sh

      - name: 选 Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.1.app
      - name: 装 XcodeGen
        run: brew install xcodegen
      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译模拟器版
        working-directory: ios
        run: |
          xcodebuild -project Lingo.xcodeproj -scheme Lingo -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      # ---- 纯逻辑测试：七个练法的出题和判卷。几秒钟跑完，放在最前面 ----
      # 它不需要截图也不需要转屏，坏了就是规则本身坏了，没必要等十分钟的界面测试。
      - name: 单元测试（练法逻辑）
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 15 Pro Max (" | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/')
          set -o pipefail
          xcodebuild test -project Lingo.xcodeproj -scheme Lingo \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:LingoTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/unit.log \
            | grep -E "Test Case|error:|\*\* TEST" | tail -40
          grep -E "error:|Failing tests|crashed" /tmp/unit.log | sort -u | head -20 || true

      - name: 启动模拟器、逐屏截图
        working-directory: ios
        run: |
          set -e
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p shots
          # $1=设备 $2=屏名 $3=light|dark $4=额外参数(比如 -select)
          shoot () {
            DEV="$1"; SCREEN="$2"; MODE="${3:-light}"; EXTRA="${4:-}"
            UDID=$(xcrun simctl list devices available | grep -m1 "$DEV (" | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/')
            [ -z "$UDID" ] && { echo "找不到 $DEV"; return; }
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl ui "$UDID" appearance "$MODE" || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.lingo.listen -demo -screen "$SCREEN" $EXTRA || true
            sleep 8            # 冷启动第一屏要加载音频和对齐，5 秒会截到半成品
            xcrun simctl io "$UDID" screenshot "shots/${DEV// /_}-${SCREEN}-${MODE}${EXTRA// /}.png" || true
            xcrun simctl terminate "$UDID" com.lingo.listen 2>/dev/null || true
          }
          # 同一台机器不反复重启，省一大半时间
          for S in drill dict review lib train; do
            shoot "iPhone 15 Pro Max" "$S" light
          done
          shoot "iPhone 15 Pro Max" "drill" dark
          shoot "iPhone 15 Pro Max" "drill" light "-select"
          shoot "iPhone SE (3rd generation)" "drill" light
          shoot "iPhone SE (3rd generation)" "drill" light "-select"
          # 抽屉里的三块也截下来：句子列表（筛选行要钉在顶上）、间隔面板、改倍速面板
          shoot "iPhone 15 Pro Max" "drill" light "-sheet list"
          shoot "iPhone 15 Pro Max" "drill" light "-sheet gap"
          shoot "iPhone 15 Pro Max" "drill" light "-sheet rate"
          # 横屏（按横屏尺寸渲染再转 90 度，看的时候用 ffmpeg 转回来）
          shoot "iPhone 15 Pro Max" "drill" light "-land"
          shoot "iPhone 15 Pro Max" "drill" dark "-land"
          # 跟读结果那块（竖屏 + 横屏）
          shoot "iPhone 15 Pro Max" "drill" light "-take"
          shoot "iPhone 15 Pro Max" "drill" light "-land -take"
          ls -la shots

      # ---- 布局体检：App 自己把每块的真实坐标报出来，重叠/超屏就 LAYOUT-FAIL ----
      # 组合覆盖：竖屏/横屏 × 大屏/SE × 文字全开(大字号)。
      # 这一步就是为了不再靠"看截图猜"，也不再让用户当测试员。
      - name: 布局体检
        continue-on-error: true          # 体检失败也要接着跑交互测试，一次看全
        run: |
          cd ios
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          fail=0
          audit () {
            DEV="$1"; EXTRA="$2"
            UDID=$(xcrun simctl list devices available | grep -m1 "$DEV (" | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/')
            [ -z "$UDID" ] && { echo "找不到 $DEV"; return; }
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" "$APP"
            OUT="audit-${DEV// /_}-${EXTRA// /}.log"
            ( xcrun simctl launch --console-pty "$UDID" com.lingo.listen \
                -demo -screen drill -audit $EXTRA > "$OUT" 2>&1 & ) || true
            sleep 12
            xcrun simctl terminate "$UDID" com.lingo.listen 2>/dev/null || true
            echo "===== $DEV $EXTRA"
            grep -E "AUDIT|LAYOUT-" "$OUT" | tail -20 || true
            if grep -q "LAYOUT-FAIL" "$OUT"; then fail=1; fi
          }
          audit "iPhone 15 Pro Max" ""            # 竖屏，四样文字全开＋大字号
          audit "iPhone 15 Pro Max" "-land"
          audit "iPhone SE (3rd generation)" ""
          [ "$fail" = "0" ] || { echo "::error::布局体检有重叠/超屏"; exit 1; }

      # ---- 真机式交互测试：真的转屏、真的点、真的滑 ----
      # 静态截图看不出"手势能不能用""这条能不能滚"，这一步专治那类问题。
      - name: 交互测试
        run: |
          cd ios
          # 用 UDID 指定设备，按名字找在这台 runner 上不一定命中
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 15 Pro Max (" | sed -E 's/.*\(([-0-9A-F]{36})\).*/\1/')
          echo "在 $UDID 上跑交互测试"
          set -o pipefail
          # 两条只在真机上跑，云端跳过：
          # · AlignerUITests 要 181M 的 CoreML 模型，模型不进仓库（超 GitHub 单文件上限）
          # · ShotUITests 是给真机导出截图用的，它会 terminate 一个 App 再 activate 另一个，
          #   在模拟器上常报 "Failed to get background assertion for target app"。
          #   云端的截图本来就由上面 simctl 那一步出，不需要它。
          xcodebuild test -project Lingo.xcodeproj -scheme Lingo \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:LingoUITests \
            -skip-testing:LingoUITests/AlignerUITests \
            -skip-testing:LingoUITests/ShotUITests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/test.log \
            | grep -E "Test Case|error:|\*\* TEST" | tail -40
          # 失败时把真正的原因贴出来（只 grep "Test Case" 会把编译错、崩溃原因全滤掉）
          # 加 || true：没找到错误时 grep 返回 1，会把整步判成失败（测试其实全过了）
          grep -E "error:|Failing tests|crashed|could not be launched" /tmp/test.log | sort -u | head -20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true      # 传产物是诊断用的，GitHub 自己超时不该把整轮判红
        with:
          name: screenshots
          path: ios/shots/*.png
          retention-days: 14

      # 体检报告也要能拿回来看 —— 光看截图估不准高度，得看真数字
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: audit-logs
          path: ios/audit-*.log
          retention-days: 14
