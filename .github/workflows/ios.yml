# 云端编译 iPhone App：出一个未签名的 .ipa，用 SideStore 在手机上签名安装。
# 未签名是故意的 —— 签名要用你自己的 Apple ID，那一步在手机上由 SideStore 完成，
# 证书不用离开你的设备。
name: build-ipa

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:            # 也可以手动点一下就编

jobs:
  build:
    runs-on: macos-14           # 苹果的机器，Xcode 已经装好了
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 看一眼环境
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Lingo.xcodeproj \
            -scheme Lingo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | xcpretty || xcodebuild \
            -project Lingo.xcodeproj -scheme Lingo -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO build

      - name: 打包成 .ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Lingo-unsigned.ipa Payload
          ls -lh Lingo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lingo-unsigned-ipa
          path: ios/Lingo-unsigned.ipa
          retention-days: 30
