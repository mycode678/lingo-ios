# 云端编译 iPhone App：出一个未签名的 .ipa，用 Sideloadly / SideStore 在手机上
# 用自己的 Apple ID 签名安装 —— 证书不用离开你的设备。
name: build-ipa

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

# 一次只留最新那一轮：连着推几个提交时，前面还在跑的直接取消。
# 不然每推一次就来一封失败邮件，而那些失败往往是下一个提交已经修掉的旧错误。
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # runner 默认还是 Xcode 15.4，而 XcodeGen 2.46 生成的工程格式要 16 才读得懂
      - name: 选 Xcode 16
        run: |
          ls /Applications | grep -i "^Xcode_16" || true
          sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Lingo.xcodeproj \
            -scheme Lingo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: 打包成 .ipa
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app = $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Lingo-unsigned.ipa Payload
          ls -lh Lingo-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Lingo-unsigned-ipa
          path: ios/Lingo-unsigned.ipa
          retention-days: 30
